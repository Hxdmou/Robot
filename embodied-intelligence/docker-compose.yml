# ============================================================================
# 具身智能机器人系统 - Docker Compose
# ============================================================================

version: '3.8'

services:
  robot-system:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: embodied-intelligence-system
    restart: unless-stopped
    ports:
      - "7861:7861"
    environment:
      - HOST=0.0.0.0
      - PORT=7861
      - DEBUG=false
      - LOG_LEVEL=INFO
      - SIM_RENDER=direct
    volumes:
      - ./logs:/app/logs
      - ./checkpoints:/app/checkpoints
      - ./deploy_archives:/app/deploy_archives
    healthcheck:
      test: ["CMD", "python", "health_check.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - robot-network

networks:
  robot-network:
    driver: bridge

volumes:
  logs:
  checkpoints:
  deploy_archives:
